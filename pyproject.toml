[project]
name = "colophon"
version = "0.1.0"
description = "Rights-availability intelligence for children's books. Evidence-backed leads with confidence tiers; never an assertion of clear title."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["colophon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
